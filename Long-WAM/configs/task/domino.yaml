defaults:
- override /data: domino
- override /model: long_wam
- _self_
output_dir: ${oc.env:LONGWAM_OUTPUT_ROOT,./outputs}/domino/${now:%Y%m%d_%H%M%S}
batch_size: 16
num_workers: 8
sampler:
  strategy: hierarchical
  domain_weights:
    robotwin: 0.5
    domino: 0.5
  domain_strategies:
    robotwin: group_uniform
    domino: group_uniform
  samples_per_epoch: 307200
learning_rate: 3.0e-06
max_steps: 300
save_state_every: 300
eval_every: 0
gradient_accumulation_steps: 8
weight_decay: 0.01
# Fine-tune the complete robot-pretrained RoboTwin policy; do not overwrite
# its trained video/action experts with separate Stage 1 initialization weights.
resume: ${oc.env:LONGWAM_ROBOTWIN_CHECKPOINT,???}
checkpoint_strict: true
wandb:
  name: domino
  group: domino
expected_global_batch_size: 1024
model_init_seed: 42
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
model:
  proprio_dim: ${data.train.domains.robotwin.processor.proprio_output_dim}
  skip_action_dit_load_from_pretrain: true
  longlive_video_weights: null
  action_dit_pretrained_path: null
  video_dit_config:
    action_dim: ${data.train.domains.robotwin.processor.action_output_dim}
  action_dit_config:
    action_dim: ${data.train.domains.robotwin.processor.action_output_dim}
