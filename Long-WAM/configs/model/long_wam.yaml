# Shared Long-WAM architecture. IDM: false; CodeDenoise: true.
_target_: longwam.runtime.create_longwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: false
mot_checkpoint_mixed_attn: true
skip_dit_load_from_pretrain: true
skip_video_dit_load_from_pretrain: true
skip_action_dit_load_from_pretrain: false
# All fresh benchmark runs use the public Robot-S video generator, not general
# LongLive 2.0. Download the pinned stage1_robot_s bundle from checkpoints.yaml.
longlive_video_weights: ${oc.env:LONGWAM_ROBOT_VIDEO_CHECKPOINT,${oc.env:LONGWAM_CHECKPOINT_ROOT,./checkpoints}/LongLive2.0-Robot-S/model.pt}
# Action initialization is independent of the video initializer; task overrides
# select random initialization (RoboTwin) or full-policy loading (Domino).
# Generate this Robot-S-derived backbone with tools/weights/preprocess_action_dit_backbone.py.
action_dit_pretrained_path: ${oc.env:LONGWAM_CHECKPOINT_ROOT,./checkpoints}/longwam/ActionDiT_from_longlive_ar_1024hdim.pt
longwam_num_frame_per_block: 1
longwam_local_attn_size: -1
longwam_sink_size: 0
longwam_past_obs_size: 48
longwam_num_imagine_frames: 2
longwam_imagine_sigma: ${denoising.sigma}
longwam_imagine_infer_steps: ${denoising.video_steps}
video_dit_config:
  has_image_input: false
  patch_size:
  - 1
  - 2
  - 2
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: per_frame_causal
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: group_diagonal
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
loss:
  lambda_action: 1.0
  lambda_video: 1.0
longwam_joint_denoise: ${denoising.joint}
